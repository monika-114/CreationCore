name: Build Creation Core v0.2

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Static resource validation
        run: python3 tools/validate_project.py

      - name: Recipe regeneration check
        run: |
          python3 -m pip install python-docx==1.2.0
          python3 tools/generate_recipes_v02.py --check

      - name: Build
        run: gradle build --stacktrace

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: creationcore-neoforge-1.21.1-1.0.0
          path: build/libs/*.jar
          if-no-files-found: error
