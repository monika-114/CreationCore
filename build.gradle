plugins {
 id 'fabric-loom' version '1.14.10'
 id 'maven-publish'
}
version = project.mod_version
group = 'dev.creationcore'
base { archivesName = 'creationcore-fabric-1.21.1' }
repositories {
 maven { url = 'https://maven.blamejared.com' }
 maven { url = 'https://api.modrinth.com/maven' }
}
dependencies {
 minecraft 'com.mojang:minecraft:1.21.1'
 mappings loom.officialMojangMappings()
 modImplementation 'net.fabricmc:fabric-loader:' + (project.findProperty('loaderVersion') ?: '0.18.4')
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1'
 modCompileOnly fileTree('libs') { include '*.jar' }
 modCompileOnly fileTree('devlibs') { include '*.jar' }
 modLocalRuntime fileTree(project.findProperty('testMods') ?: 'libs') { include '*.jar' }
 if (!project.hasProperty('testMods')) modLocalRuntime fileTree('devlibs') { include '*.jar' }
}
loom { accessWidenerPath = file('src/main/resources/creationcore.accesswidener') }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.named('processResources') { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }

sourceSets {
 testmod {
  compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
  runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
 }
}
loom {
 mods {
  creationcore { sourceSet sourceSets.main }
  creationcore_test { sourceSet sourceSets.testmod }
 }
 runs {
  testClient { client(); source sourceSets.testmod; runDir 'run-client' }
  testServer {
   server()
   name = 'Fabric verification server'
   source sourceSets.testmod
   runDir project.hasProperty('checkMode') ? 'run-test-' + project.property('checkMode') : (project.hasProperty('checkCrafter') ? 'run-test-crafter' : 'run-test')
   programArg 'nogui'
   vmArg '-Dcreationcore.gameplay=' + (project.findProperty('checkMode') == 'gameplay')
   vmArg '-Dcreationcore.redstone=' + (project.findProperty('checkMode') == 'redstone')
   vmArg '-Dcreationcore.checkCrafter=' + (project.findProperty('checkCrafter') ?: 'false')
  }
 }
}

tasks.register('testmodJar', Jar) {
 from sourceSets.testmod.output
 archiveClassifier = 'testmod-dev'
}
tasks.register('remapTestmodJar', net.fabricmc.loom.task.RemapJarTask) {
 dependsOn tasks.testmodJar
 inputFile = tasks.testmodJar.archiveFile
 archiveClassifier = 'testmod'
 classpath.from sourceSets.testmod.compileClasspath
}
configurations { productionRuntimeMods }
dependencies { productionRuntimeMods 'net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1' }
tasks.register('prodServer', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
 installerVersion = '1.0.1'
 loaderVersion = '0.20.1'
 minecraftVersion = '1.21.1'
 mods.from tasks.remapJar
 mods.from tasks.remapTestmodJar
 mods.from configurations.productionRuntimeMods
 mods.from fileTree(project.findProperty('testMods') ?: 'libs') { include '*.jar' }
 runDir = file(project.findProperty('prodDir') ?: 'run-production')
 programArgs.add('nogui')
}
