modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
logoFile="logo.png"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
description='''
围绕“创造物质”与世界交互仪式展开的终局生存扩展模组。
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[mixins]]
config="${mod_id}.mixins.json"

[[mixins]]
config="creationcore.ae2.mixins.json"

[[mixins]]
config="creationcore.create.mixins.json"

[[dependencies.${mod_id}]]
modId="create"
type="optional"
versionRange="[6.0.10,6.1)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ae2"
type="optional"
versionRange="[19.2.18,19.3)"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="creationcore.compat.mixins.json"

[[dependencies.${mod_id}]]
modId="sophisticatedcore"
type="optional"
versionRange="[1.5.2,1.6)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sophisticatedbackpacks"
type="optional"
versionRange="[3.26.5,3.27)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sophisticatedstorage"
type="optional"
versionRange="[1.6.0,1.7)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="toms_storage"
type="optional"
versionRange="[2.4.2,2.5)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="beyonddimensions"
type="optional"
versionRange="[0.7.30,0.8)"
ordering="AFTER"
side="BOTH"
