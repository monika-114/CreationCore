gradle.projectsEvaluated {
    def p=gradle.rootProject
    p.dependencies.add('localRuntime',p.fileTree(p.property('redstoneMods')) { include '*.jar' })
    def checks=p.sourceSets.create('redstoneChecks')
    checks.java.srcDir('tools/redstone-checks')
    checks.compileClasspath += p.sourceSets.main.compileClasspath + p.sourceSets.main.output
    checks.runtimeClasspath += checks.compileClasspath
    p.neoForge.mods.creationcore.sourceSet(checks)
    p.tasks.named('compileRedstoneChecksJava').configure { dependsOn p.tasks.named('classes') }
    p.tasks.named('runServer').configure { dependsOn p.tasks.named('redstoneChecksClasses') }
}
