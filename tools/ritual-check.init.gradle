gradle.projectsEvaluated {
    def project = gradle.rootProject
    def compileCheck = project.tasks.register('compileRitualStateCheck', JavaCompile) {
        dependsOn project.tasks.named('classes')
        source project.file('tools/RitualStateCheck.java')
        classpath = project.sourceSets.main.compileClasspath + project.sourceSets.main.output
        destinationDirectory = project.layout.buildDirectory.dir('ritual-state-check')
        javaCompiler = project.javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
    }
    project.tasks.register('ritualStateCheck', JavaExec) {
        dependsOn compileCheck
        classpath = project.sourceSets.main.compileClasspath + project.sourceSets.main.output + project.files(project.layout.buildDirectory.dir('ritual-state-check'))
        mainClass = 'RitualStateCheck'
        javaLauncher = project.javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    }
}
