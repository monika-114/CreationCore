gradle.projectsEvaluated {
    def p = gradle.rootProject
    if (p.hasProperty("networkCrafter")) p.neoForge.runs.server.systemProperty("creationcore.checkCrafter", "true")
    def mods = p.fileTree(p.property('compatTestMods')) { include '*.jar' }
    p.dependencies.add('localRuntime', mods)
    def checks = p.sourceSets.create('compatChecks')
    checks.java.srcDir('tools/compat-checks')
    checks.compileClasspath += p.sourceSets.main.compileClasspath + p.sourceSets.main.output + mods
    checks.runtimeClasspath += checks.compileClasspath
    p.neoForge.mods.creationcore.sourceSet(checks)
    p.tasks.named('compileCompatChecksJava').configure { dependsOn p.tasks.named('classes') }
    p.tasks.named('runServer').configure { dependsOn p.tasks.named('compatChecksClasses') }
}
