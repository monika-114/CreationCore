// Opt-in real AE2 checks. AE2/GuideME are external test dependencies, never packaged.
gradle.projectsEvaluated {
    def p = gradle.rootProject
    if (p.hasProperty("networkCrafter")) p.neoForge.runs.server.systemProperty("creationcore.checkCrafter", "true")
    def testMods = p.fileTree(p.property('ae2TestMods')) { include '*.jar' }
    p.dependencies.add('localRuntime', testMods)
    def checks = p.sourceSets.create('networkChecks')
    checks.java.srcDir('tools/network-checks')
    checks.compileClasspath += p.sourceSets.main.compileClasspath + p.sourceSets.main.output + testMods
    checks.runtimeClasspath += checks.compileClasspath
    p.neoForge.mods.creationcore.sourceSet(checks)
    p.tasks.named('compileNetworkChecksJava').configure { dependsOn p.tasks.named('classes') }
    p.tasks.named('runServer').configure { dependsOn p.tasks.named('networkChecksClasses') }
}
