gradle.projectsEvaluated {
    def p = gradle.rootProject
    if (p.hasProperty('isolationMods')) p.dependencies.add('localRuntime', p.fileTree(p.property('isolationMods')) { include '*.jar' })
    def checks = p.sourceSets.create('isolationChecks')
    checks.java.srcDir('tools/isolation-checks')
    checks.compileClasspath += p.sourceSets.main.compileClasspath + p.sourceSets.main.output
    checks.runtimeClasspath += checks.compileClasspath
    p.neoForge.mods.creationcore.sourceSet(checks)
    p.tasks.named('compileIsolationChecksJava').configure { dependsOn p.tasks.named('classes') }
    p.tasks.named('runServer').configure { dependsOn p.tasks.named('isolationChecksClasses') }
}
