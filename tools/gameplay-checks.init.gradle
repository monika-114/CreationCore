// Opt-in integration source set; never included in the production JAR.
gradle.projectsEvaluated {
    def p = gradle.rootProject
    def checks = p.sourceSets.create('gameplayChecks')
    checks.java.srcDir('tools/gameplay-checks')
    checks.java.srcDir('tools/fluid-checks')
    checks.compileClasspath += p.sourceSets.main.compileClasspath + p.sourceSets.main.output
    checks.runtimeClasspath += checks.compileClasspath
    p.neoForge.mods.creationcore.sourceSet(checks)
    p.tasks.named('compileGameplayChecksJava').configure { dependsOn p.tasks.named('classes') }
    p.tasks.named('runServer').configure { dependsOn p.tasks.named('gameplayChecksClasses') }
}
